name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build static website
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ vars.SITE_BASE_PATH || '/glanzberg-web' }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.SITE_URL || 'https://glanzberg-web.github.io/glanzberg-web' }}
          NEXT_PUBLIC_CONTACT_ENDPOINT: ${{ vars.CONTACT_ENDPOINT }}

      - name: Prepare Pages output
        env:
          CUSTOM_DOMAIN: ${{ vars.CUSTOM_DOMAIN }}
        run: |
          touch out/.nojekyll
          if [ -n "$CUSTOM_DOMAIN" ]; then
            printf '%s\n' "$CUSTOM_DOMAIN" > out/CNAME
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
